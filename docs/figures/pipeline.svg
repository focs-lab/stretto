<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Stretto's pipeline: trace one run, recover the observed matching, enumerate alternatives inside the horizon, check each with a constraint graph, report its consequence and confirm it by a pinned replay with a control.">
  <defs>
    <marker id="ar" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="4"><path d="M0 0 L8 4 L0 8 Z" fill="#9AA3B2"/></marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="1" y="1" width="958" height="248" rx="16" fill="#F7F5F0" stroke="#E2DDD2" stroke-width="2"/>
    <g id="boxes" font-size="13" fill="#3F4A5C">
      <rect x="18" y="22" width="168" height="206" rx="12" fill="#FFFDF8" stroke="#E2DDD2" stroke-width="2"/>
      <rect x="206" y="22" width="168" height="206" rx="12" fill="#FFFDF8" stroke="#E2DDD2" stroke-width="2"/>
      <rect x="394" y="22" width="168" height="206" rx="12" fill="#FFFDF8" stroke="#E8873A" stroke-width="2"/>
      <rect x="582" y="22" width="168" height="206" rx="12" fill="#FFFDF8" stroke="#E2DDD2" stroke-width="2"/>
      <rect x="770" y="22" width="172" height="206" rx="12" fill="#FFFDF8" stroke="#1F5FA8" stroke-width="2"/>
    </g>
    <g fill="#14213D">
      <circle cx="44" cy="50" r="14" fill="#14213D"/><text x="44" y="55" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">1</text>
      <circle cx="232" cy="50" r="14" fill="#14213D"/><text x="232" y="55" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">2</text>
      <circle cx="420" cy="50" r="14" fill="#E8873A"/><text x="420" y="55" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">3</text>
      <circle cx="608" cy="50" r="14" fill="#14213D"/><text x="608" y="55" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">4</text>
      <circle cx="796" cy="50" r="14" fill="#1F5FA8"/><text x="796" y="55" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">5</text>
      <text x="66" y="56" font-size="16" font-weight="600">Trace</text>
      <text x="254" y="56" font-size="16" font-weight="600">Observed run</text>
      <text x="442" y="56" font-size="16" font-weight="600">Alternatives</text>
      <text x="630" y="56" font-size="16" font-weight="600">Check</text>
      <text x="818" y="56" font-size="16" font-weight="600">Consequence</text>
    </g>
    <g font-size="13" fill="#3F4A5C">
      <text x="32" y="88"><tspan x="32">A PMPI library,</tspan><tspan x="32" dy="18">preloaded, writes</tspan><tspan x="32" dy="18">one record per MPI</tspan><tspan x="32" dy="18">call and rank.</tspan><tspan x="32" dy="26" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#1F5FA8">rank-N.jsonl</tspan></text>
      <text x="220" y="88"><tspan x="220">Which send each</tspan><tspan x="220" dy="18">receive took, and the</tspan><tspan x="220" dy="18">order MPI's matching</tspan><tspan x="220" dy="18">rules forced.</tspan></text>
      <text x="408" y="88"><tspan x="408">Every other send a</tspan><tspan x="408" dy="18">wildcard receive or</tspan><tspan x="408" dy="18">probe could take,</tspan><tspan x="408" dy="18">within the horizon the</tspan><tspan x="408" dy="18">trace still determines.</tspan></text>
      <text x="596" y="88"><tspan x="596">A constraint graph</tspan><tspan x="596" dy="18">over matches: acyclic</tspan><tspan x="596" dy="18">means realisable.</tspan><tspan x="596" dy="18">Sound; polynomial;</tspan><tspan x="596" dy="18">per buffering limit.</tspan></text>
      <text x="784" y="88"><tspan x="784">Deadlock, lost message,</tspan><tspan x="784" dy="18">buffering hang, other</tspan><tspan x="784" dy="18">data. Confirmed by a</tspan><tspan x="784" dy="18">rerun with the match</tspan><tspan x="784" dy="18">forced, and a control.</tspan></text>
    </g>
    <g stroke="#9AA3B2" stroke-width="3" marker-end="url(#ar)">
      <line x1="187" y1="125" x2="200" y2="125"/>
      <line x1="375" y1="125" x2="388" y2="125"/>
      <line x1="563" y1="125" x2="576" y2="125"/>
      <line x1="751" y1="125" x2="764" y2="125"/>
    </g>
  </g>
</svg>
